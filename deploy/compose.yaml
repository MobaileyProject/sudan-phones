name: sudan-backend
x-app: &app
  image: sudan-backend:${BACKEND_TAG:-local}
  build:
    context: ..
    dockerfile: backend/Dockerfile
  env_file: ${BACKEND_ENV_FILE:?Set BACKEND_ENV_FILE to a private absolute env path}
  environment:
    DJANGO_SETTINGS_MODULE: config.production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    REDIS_CACHE_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 768m
  cpus: 1.0
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  postgres:
    image: postgres:16-alpine
    env_file: ${BACKEND_ENV_FILE:?Set BACKEND_ENV_FILE}
    restart: unless-stopped
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m
  api:
    <<: *app
    ports: ['127.0.0.1:${BACKEND_PORT:-8000}:8000']
    healthcheck:
      test: [CMD, python, manage.py, check_runtime]
      interval: 30s
      timeout: 15s
      retries: 3
  worker:
    <<: *app
    command: [celery, -A, config, worker, --loglevel=WARNING, --concurrency=1, --hostname=media@%h]
  beat:
    <<: *app
    command: [celery, -A, config, beat, --loglevel=WARNING, --schedule=/tmp/celerybeat-schedule]
volumes:
  postgres-data:
  redis-data:
