    <script>
      (function () {
        function isExtFetchError(filename, message, stack) {
          var src = String(filename || '') + ' ' + String(stack || '');
          var msg = String(message || '');
          return (
            src.indexOf('chrome-extension://') !== -1 &&
            msg.indexOf('Cannot set property fetch') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (e) {
            if (isExtFetchError(e.filename, e.message, e.error && e.error.stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var r = e.reason;
            if (r && isExtFetchError('', r.message, r.stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
