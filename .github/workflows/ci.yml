name: CI & Slack Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, review_requested]

permissions:
  contents: read

jobs:
  validate:
    name: Validation & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Secret Scan
        run: python3 scripts/check_secrets.py
      - name: Run Workspace Tool Tests
        run: make test
      - name: Check Python and JSON Syntax
        run: make lint
      - name: Install Backend Dependencies When Scaffolded
        if: hashFiles('backend/requirements.txt') != ''
        run: python3 -m pip install -r backend/requirements.txt
      - name: Check OpenAPI Contract Drift
        run: make openapi-check

  notify:
    name: Notify Slack
    needs: [validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        if: env.SLACK_BOT_TOKEN != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_UPDATES || 'C0CHSASMZMK' }}
          WORKFLOW_STATUS: ${{ needs.validate.result }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PAYLOAD=$(python3 - <<'PYTHON'
          import json
          import os
          status = "passed" if os.environ["WORKFLOW_STATUS"] == "success" else "failed"
          run_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          text = f"GitHub Actions CI: validation {status} on {os.environ['GITHUB_SHA'][:7]}. <{run_url}|View workflow>"
          if os.environ.get("PR_URL"):
              title = os.environ["PR_TITLE"].replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
              text += f"\nPR {os.environ.get('EVENT_ACTION', '')}: <{os.environ['PR_URL']}|{title}>"
          print(json.dumps({"channel": os.environ["SLACK_CHANNEL"], "text": text}))
          PYTHON
          )

          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-type: application/json; charset=utf-8" \
            -d "$PAYLOAD" \
            https://slack.com/api/chat.postMessage > /tmp/slack-response.json
          python3 - <<'PYTHON'
          import json
          with open("/tmp/slack-response.json") as response:
              result = json.load(response)
          if not result.get("ok"):
              raise SystemExit("Slack delivery failed: " + result.get("error", "unknown_error"))
          print("Slack notification delivered.")
          PYTHON
